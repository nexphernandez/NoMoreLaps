<div class="login-container">
  <div class="login-card glass-card">
    <div class="login-header">
      <h1 class="gradient-text">NoMoreLaps</h1>
      <p class="subtitle">Portal de Empresas</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <app-input 
        label="Correo Electrónico" 
        placeholder="ejemplo@empresa.com"
        type="email"
        formControlName="email"
      ></app-input>

      <app-input 
        label="Contraseña" 
        placeholder="••••••••"
        type="password"
        formControlName="password"
      ></app-input>

      <div class="error-container" *ngIf="errorMessage">
        <p class="error-text">{{ errorMessage }}</p>
      </div>

      <div class="form-footer">
        <a href="#" class="forgot-password">¿Has olvidado tu contraseña?</a>
      </div>

      <app-button 
        text="Iniciar Sesión" 
        customClass="w-full"
        [loading]="loading"
        type="submit"
      ></app-button>

      <div class="register-prompt">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/register" class="register-link">Regístrate ahora</a>
      </div>
    </form>
  </div>
</div>
