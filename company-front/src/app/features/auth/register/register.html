<div class="register-container">
  <div class="register-card glass-card">
    <div class="register-header">
      <h1 class="gradient-text">NoMoreLaps</h1>
      <p class="subtitle">Crear Cuenta de Empresa</p>
    </div>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <app-input 
        label="Nombre de la Empresa" 
        placeholder="Mi Parking S.L."
        type="text"
        formControlName="name"
      ></app-input>

      <app-input 
        label="CIF de la Empresa" 
        placeholder="A12345678"
        type="text"
        formControlName="cif"
      ></app-input>

      <app-input 
        label="Correo Corporativo" 
        placeholder="contacto@empresa.com"
        type="email"
        formControlName="email"
      ></app-input>

      <div class="password-row">
        <app-input 
          label="Contraseña" 
          placeholder="••••••••"
          type="password"
          formControlName="password"
        ></app-input>
        
        <app-input 
          label="Confirmar Contraseña" 
          placeholder="••••••••"
          type="password"
          formControlName="confirmPassword"
        ></app-input>
      </div>

      <div class="error-container" *ngIf="errorMessage || registerForm.get('email')?.invalid && registerForm.get('email')?.touched || registerForm.hasError('mismatch')">
        <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">Email inválido</p>
        <p class="error-text" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">Las contraseñas no coinciden</p>
      </div>

      <div class="terms-container">
        <label class="checkbox-label">
          <input type="checkbox">
          <span>Acepto los <a href="#">términos y condiciones</a> de servicio</span>
        </label>
      </div>

      <app-button 
        text="Crear Cuenta" 
        customClass="w-full"
        [loading]="loading"
        type="submit"
      ></app-button>

      <div class="login-prompt">
        <span>¿Ya tienes una cuenta?</span>
        <a routerLink="/login" class="login-link">Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
