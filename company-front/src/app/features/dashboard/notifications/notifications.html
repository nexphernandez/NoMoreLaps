<div class="notifications-container">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Centro de Alertas</h1>
      <p class="page-subtitle">Mantente al día con lo que sucede en tus parkings.</p>
    </div>
  </header>

  <div class="notifications-list" *ngIf="!loading && notifications.length > 0">
    <div *ngFor="let n of notifications" 
         class="notification-card glass-card" 
         [class.unread]="!n.isRead"
         (click)="markAsRead(n)">
      <div class="notif-icon" [ngClass]="n.type.toLowerCase()">
        <span *ngIf="n.type === 'RESERVATION'">📅</span>
        <span *ngIf="n.type === 'SANCTION'">⚖️</span>
        <span *ngIf="n.type === 'CANCEL'">❌</span>
      </div>
      
      <div class="notif-content">
        <p class="notif-message">{{ n.message }}</p>
        <span class="notif-time">{{ formatDate(n.createdAt) }}</span>
      </div>

      <div class="notif-actions">
        <button class="delete-btn" (click)="$event.stopPropagation(); deleteNotification(n.id)">
          🗑️
        </button>
      </div>
    </div>
  </div>

  <div class="loading-container" *ngIf="loading">
    <p>Cargando notificaciones...</p>
  </div>

  <div class="empty-container" *ngIf="!loading && notifications.length === 0">
    <div class="empty-icon">📭</div>
    <p>No tienes notificaciones por ahora.</p>
  </div>
</div>
