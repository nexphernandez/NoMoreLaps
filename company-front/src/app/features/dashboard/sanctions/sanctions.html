<div class="sanctions-container">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Control de Sanciones</h1>
      <p class="page-subtitle">Gestiona las penalizaciones por exceso de tiempo y mal uso.</p>
    </div>
  </header>

  <div class="stats-row">
    <div class="mini-stat glass-card">
      <span class="label">Total Recaudado</span>
      <span class="value">450.00€</span>
    </div>
    <div class="mini-stat glass-card">
      <span class="label">Pendientes de Pago</span>
      <span class="value highlight">12</span>
    </div>
  </div>

  <div class="filters-bar glass-card">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar por usuario o matrícula..." class="filter-input">
    </div>
    <div class="filter-actions">
      <select class="filter-select">
        <option value="all">Todos los estados</option>
        <option value="pending">Pendiente</option>
        <option value="paid">Pagada</option>
      </select>
    </div>
  </div>

  <div class="sanctions-list">
    <div class="list-header">
      <span>INFRACTOR Y UBICACIÓN</span>
      <span>FECHA E IMPORTE</span>
      <span>ESTADO</span>
      <span>ACCIONES</span>
    </div>

    <app-sanction-row 
      *ngFor="let sanc of mockSanctions"
      [userName]="sanc.user"
      [parkingName]="sanc.parking"
      [date]="sanc.date"
      [amount]="sanc.amount"
      [status]="sanc.status"
    ></app-sanction-row>
  </div>
</div>
