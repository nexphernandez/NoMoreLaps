<div class="dashboard-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <header class="content-header">
      <div class="header-search">
        <input type="text" placeholder="Search in the system..." class="search-input" (input)="onSearch($event)">
      </div>

      <div class="header-actions">
        <div class="notification-wrapper">
          <button class="icon-btn" (click)="toggleNotifications()">
            <span class="material-symbols-outlined">notifications</span>
            <span class="badge" *ngIf="(unreadCount$ | async) ?? 0 > 0">{{ unreadCount$ | async }}</span>
          </button>

          <div class="notification-dropdown" *ngIf="showNotifications">
            <div class="dropdown-header">
              <h3>Notifications</h3>
              <a routerLink="/dashboard/notifications" (click)="showNotifications = false">View all</a>
            </div>
            <div class="dropdown-body">
              <div *ngFor="let note of (recentNotifications$ | async)?.slice(0, 5)" class="notification-item"
                [class.unread]="!note.isRead" (click)="markAsRead(note.id)">
                <div class="note-icon">
                  <span class="material-symbols-outlined">{{ note.type === 'SANCTION' ? 'warning' : 'info' }}</span>
                </div>
                <div class="note-content">
                  <p class="note-message">{{ note.message }}</p>
                  <span class="note-date">{{ note.createdAt | date:'short' }}</span>
                </div>
              </div>
              <div class="empty-notifications" *ngIf="((recentNotifications$ | async)?.length ?? 0) === 0">
                No notifications
              </div>
            </div>
          </div>
        </div>
        <div class="user-profile">
          <div class="user-avatar">
            <span class="material-symbols-outlined">corporate_fare</span>
          </div>
          <div class="user-info" *ngIf="user() as userData">
            <span class="user-name">{{ userData.name }}</span>
            <span class="user-role">{{ userData.email }}</span>
          </div>
        </div>
      </div>
    </header>

    <section class="content-area">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
