<div class="parkings-container">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Parking Management</h1>
      <p class="page-subtitle">Manage your locations and sanction settings.</p>
    </div>
    <button class="btn-primary" (click)="onAddParking()">+ Add Parking</button>
  </header>

  <div class="filters-bar glass-card">
    <div class="filter-actions">
      <select class="filter-select" [(ngModel)]="statusFilter">
        <option value="all">All statuses</option>
        <option value="active">Open</option>
        <option value="inactive">Closed</option>
      </select>
    </div>
  </div>

  @if (!loading) {
    <div class="parkings-grid">
      @for (parking of filteredParkings; track parking.id) {
        <app-parking-card 
          [id]="parking.id!"
          [name]="parking.name"
          [address]="parking.address"
          [capacity]="parking.totalSpots || 0" 
          [status]="parking.status"
          [price]="parking.pricePerHour || 0"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
          (manage)="onManage($event)"
        ></app-parking-card>
      }
    </div>

    @if (parkings.length === 0) {
      <div class="empty-container">
        <p>No parkings registered. Start by adding one!</p>
      </div>
    }
  } @else {
    <div class="loading-container">
      <p>Loading your parkings...</p>
    </div>
  }
</div>
