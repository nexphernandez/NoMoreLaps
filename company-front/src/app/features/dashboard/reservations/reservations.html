<div class="reservations-container">
  <header class="page-header">
    <div class="header-text">
      <h1 class="page-title">Listado de Reservas</h1>
      <p class="page-subtitle">Monitorea la actividad en tiempo real de tus parkings.</p>
    </div>
  </header>

  <div class="filters-bar glass-card">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" 
             placeholder="Buscar por usuario..." 
             class="filter-input"
             [(ngModel)]="searchTerm">
    </div>
    <div class="filter-actions">
      <select class="filter-select" [(ngModel)]="parkingFilter">
        <option value="all">Todos los parkings</option>
        <option *ngFor="let p of parkings" [value]="p.name">{{ p.name }}</option>
      </select>
      
      <select class="filter-select" [(ngModel)]="statusFilter">
        <option value="all">Todos los estados</option>
        <option value="active">Activa</option>
        <option value="finished">Finalizada</option>
        <option value="canceled">Cancelada</option>
      </select>
    </div>
  </div>

  <div class="reservations-list">
    <div class="list-header">
      <span>USUARIO Y UBICACIÓN</span>
      <span>FECHA Y HORA</span>
      <span>ESTADO</span>
      <span>PAGO</span>
      <span>ACCIONES</span>
    </div>

    <app-reservation-row 
      *ngFor="let res of filteredReservations"
      [userName]="res.userName"
      [parkingName]="res.parkingName"
      [date]="formatDate(res.startTime)"
      [time]="formatTime(res.startTime, res.endTime)"
      [status]="res.state === 'ACTIVE' ? 'Activa' : res.state === 'COMPLETED' ? 'Finalizada' : 'Cancelada'"
      [price]="res.price"
      [paid]="res.paid"
    ></app-reservation-row>
  </div>

  <div class="loading-container" *ngIf="loading">
    <p>Cargando reservas...</p>
  </div>

  <div class="empty-container" *ngIf="!loading && filteredReservations.length === 0">
    <p>No se encontraron reservas.</p>
  </div>
</div>
