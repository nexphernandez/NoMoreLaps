# ===== Test Database Configuration (H2 In-Memory) =====
# Overrides production PostgreSQL settings so tests run without Docker
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ===== JWT Secret for Testing =====
app.jwt.secret=TEST_SECRET_AT_LEAST_32_CHARACTERS_LONG_FOR_SECURITY
app.jwt.expiration-minutes=60

# ===== Google Maps API Key for Testing =====
google.maps.api.key=TEST_KEY

# ===== Odoo ERP Integration for Testing =====
odoo.url=http://localhost:8069
odoo.db=test_db
odoo.username=test_user
odoo.password=test_pass
